<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Login – Localink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=General+Sans:ital,wght@0,200..700;1,200..700&display=swap" />
  <script src="script.js" defer></script>
</head>
<body class="font-body antialiased bg-[var(--background)] text-[var(--foreground)]">

  <!-- ======== NAVBAR (same as index.html) ======== -->
  <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent">
    <div class="mx-auto w-full px-4 sm:px-6 lg:px-8 max-w-7xl">
      <nav class="flex items-center justify-between h-16 md:h-18">
        <a href="index.html" class="flex items-center gap-2.5 group">
          <div class="relative w-9 h-9 rounded-xl bg-gradient-to-br from-[var(--navy)] to-[var(--orange)] flex items-center justify-center overflow-hidden shadow-[0_2px_8px_rgba(0,35,73,0.2)] group-hover:shadow-[0_4px_16px_rgba(255,146,28,0.3)] transition-shadow duration-500">
            <span class="text-white font-display font-bold text-sm relative z-10 tracking-tight">L</span>
            <div class="absolute inset-0 bg-gradient-to-br from-[var(--orange)] to-[var(--navy)] opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
          </div>
          <span class="font-display font-bold text-xl text-[var(--foreground)] hidden sm:block">Local<span class="text-[var(--orange)] group-hover:text-[var(--orange-dark)] transition-colors">ink</span></span>
        </a>
        <div class="hidden lg:flex items-center gap-1">
          <a href="index.html" class="relative px-4 py-2 text-sm font-medium rounded-lg transition-colors flex items-center gap-1 text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Home</a>
          <a href="search.html" class="relative px-4 py-2 text-sm font-medium rounded-lg transition-colors flex items-center gap-1 text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Services</a>
          <a href="accommodation.html" class="relative px-4 py-2 text-sm font-medium rounded-lg transition-colors flex items-center gap-1 text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Stays</a>
          <a href="pricing.html" class="relative px-4 py-2 text-sm font-medium rounded-lg transition-colors flex items-center gap-1 text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Pricing</a>
          <a href="about.html" class="relative px-4 py-2 text-sm font-medium rounded-lg transition-colors flex items-center gap-1 text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">About</a>
        </div>
        <div class="flex items-center gap-2">
          <a href="search.html" class="w-9 h-9 rounded-xl bg-[var(--background-tertiary)] hover:bg-[var(--border)] flex items-center justify-center transition-colors duration-200" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="text-[var(--foreground-muted)]"><path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/></svg>
          </a>
          <button id="themeToggle" class="relative w-9 h-9 rounded-xl bg-[var(--background-tertiary)] hover:bg-[var(--border)] flex items-center justify-center transition-colors duration-200" aria-label="Switch theme">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="text-[var(--navy)] dark:text-white"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/></svg>
          </button>
          <a href="login.html" class="hidden md:block">
            <button class="relative inline-flex items-center justify-center font-display font-semibold rounded-xl transition-all duration-200 ease-out active:scale-[0.98] border-2 border-[var(--navy)] text-[var(--navy)] bg-transparent hover:bg-[var(--navy)] hover:text-white dark:border-[var(--foreground-muted)] dark:text-[var(--foreground)] dark:hover:bg-[var(--foreground-muted)]/10 px-3.5 py-1.5 text-sm gap-1.5">Provider Login</button>
          </a>
          <a href="register-provider.html" class="hidden md:block">
            <button class="relative inline-flex items-center justify-center font-display font-semibold rounded-xl transition-all duration-200 ease-out active:scale-[0.98] bg-[var(--orange)] text-white shadow-[0_2px_8px_rgba(255,146,28,0.3)] hover:bg-[var(--orange-dark)] hover:shadow-[0_4px_16px_rgba(255,146,28,0.4)] active:shadow-[0_1px_4px_rgba(255,146,28,0.3)] px-3.5 py-1.5 text-sm gap-1.5">List Your Business</button>
          </a>
          <button id="mobileMenuBtn" class="lg:hidden w-9 h-9 rounded-xl bg-[var(--background-tertiary)] hover:bg-[var(--border)] flex items-center justify-center transition-colors" aria-label="Toggle menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3,8H21a1,1,0,0,0,0-2H3A1,1,0,0,0,3,8Zm18,8H3a1,1,0,0,0,0,2H21a1,1,0,0,0,0-2Zm0-5H3a1,1,0,0,0,0,2H21a1,1,0,0,0,0-2Z"/></svg>
          </button>
        </div>
      </nav>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-[var(--background-secondary)] border-t border-[var(--border)] px-4 py-4 space-y-2">
      <a href="index.html" class="block text-sm font-medium text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Home</a>
      <a href="search.html" class="block text-sm font-medium text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Services</a>
      <a href="accommodation.html" class="block text-sm font-medium text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Stays</a>
      <a href="pricing.html" class="block text-sm font-medium text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Pricing</a>
      <a href="about.html" class="block text-sm font-medium text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">About</a>
      <hr class="border-[var(--border)]" />
      <a href="login.html" class="block text-sm font-medium text-[var(--foreground-secondary)] hover:text-[var(--foreground)]">Provider Login</a>
      <a href="register-provider.html" class="block btn-primary text-center text-sm">List Your Business</a>
    </div>
  </header>

  <div class="min-h-screen flex items-center justify-center px-4 pt-20">
    <div class="bg-[var(--card-bg)] rounded-2xl border border-[var(--border)] p-10 w-full max-w-md">
      <h1 class="text-3xl font-black uppercase italic tracking-tighter text-center mb-8">Sign In</h1>
      <form id="loginForm" class="space-y-6">
        <div><label class="text-xs font-black">Email</label><input type="email" id="email" class="w-full bg-[var(--input-bg)] border rounded-xl p-3 text-[var(--foreground)] border-[var(--border)] focus:outline-none focus:border-[var(--orange)]"></div>
        <div><label class="text-xs font-black">Password</label><input type="password" id="password" class="w-full bg-[var(--input-bg)] border rounded-xl p-3 text-[var(--foreground)] border-[var(--border)] focus:outline-none focus:border-[var(--orange)]"></div>
        <button type="submit" class="w-full btn-primary">Login</button>
      </form>
      <p class="text-center text-xs mt-6 text-[var(--foreground-muted)]">Don't have an account? <a href="register.html" class="text-[var(--orange)] hover:underline">Register</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const success = await login(email, password);
      if (success) {
        const role = localStorage.getItem('userRole');
        if (role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }
      }
    });
  </script>

</body>
</html>
