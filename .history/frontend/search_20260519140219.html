<!DOCTYPE html>

<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">

  <!-- Same navbar as index.html (copy) -->

          </div>
        </div>
        <div class="flex bg-[var(--bg-main)] rounded-2xl p-1.5 border border-[var(--border-main)]">
          <button id="gridViewBtn" class="p-3 rounded-xl bg-accent text-white shadow-neon transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></button>

      <div class="group bg-[var(--card-bg)] p-6 rounded-[3rem] border border-[var(--border-main)] hover:shadow-2xl transition-all flex flex-col gap-6">
        <div class="h-48 w-full rounded-[2rem] overflow-hidden shrink-0 border-4 border-[var(--card-bg)] shadow-sm ring-1 ring-[var(--border-main)]"><img src="https://placehold.co/400x300" alt="business" class="w-full h-full object-cover"></div>
        <div class="flex-1 flex flex-col px-2"><div class="flex justify-between items-start mb-4"><div><h3 class="text-xl font-black uppercase tracking-tighter group-hover:text-accent transition-colors leading-tight mb-2 text-[var(--text-main)]">The Hair Lounge</h3><span class="badge-verified">Verified Pro</span></div><div class="flex items-center gap-1 font-black text-[10px] italic py-1 px-3 bg-yellow-500/10 rounded-lg text-yellow-500">★ 4.9</div></div><p class="text-gray-400 text-[10px] font-black uppercase tracking-widest mb-6">Premium hair styling and treatment in Windhoek.</p><div class="mt-auto flex items-center justify-between pt-6 border-t border-dashed border-[var(--border-main)]"><span class="text-accent font-black tracking-tighter text-sm uppercase italic">Starting N$350</span><div class="flex gap-2"><a href="#" class="p-3 rounded-2xl bg-green-500/10 text-green-500 hover:bg-green-500 hover:text-white"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg></a><a href="business.html" class="px-5 py-2.5 bg-accent text-white text-[10px] font-black uppercase tracking-widest rounded-2xl hover:opacity-80 shadow-neon">Book</a></div></div></div>
      </div>
      <!-- Add more cards... -->
    </div>
    <div id="mapContainer" class="hidden h-[700px] rounded-[3rem] overflow-hidden border border-[var(--border-main)] shadow-2xl bg-[var(--card-bg)] flex items-center justify-center">
      <div class="text-center p-10"><svg class="w-20 h-20 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4"></path></svg><p class="text-gray-500 font-black uppercase tracking-widest">Map preview – integrate Google Maps API with your backend data.</p></div>
