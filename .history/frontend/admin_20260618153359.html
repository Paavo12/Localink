<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – Localink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-[var(--bg-main)]">
  <div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black">Admin Control Panel</h1>
      <button id="logoutAdminBtn" class="btn-secondary">Logout</button>
    </div>
    <div id="adminContent">Loading...</div>
  </div>
  <script>
    document.getElementById('logoutAdminBtn')?.addEventListener('click', logout);
  </script>
</body>
<!-- Provider Details Modal -->
<div id="providerModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-[var(--card-bg)] rounded-2xl border border-[var(--border-main)] max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold" id="modalTitle">Provider Details</h2>
      <button id="closeModalBtn" class="text-3xl leading-none">&times;</button>
    </div>
    <div id="modalContent">
      Loading...
    </div>
  </div>
</div>
</html>
