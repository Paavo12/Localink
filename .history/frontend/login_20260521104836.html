<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – NamibConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)]">
  <nav class="fixed top-0 left-0 right-0 z-50 glass-nav h-20">...</nav>
  <div class="min-h-screen flex items-center justify-center px-4 pt-20">
    <div class="bg-[var(--card-bg)] rounded-2xl border border-[var(--border-main)] p-10 w-full max-w-md">
      <h1 class="text-3xl font-black uppercase italic tracking-tighter text-center mb-8">Sign In</h1>
      <form id="loginForm" class="space-y-6">
        <div><label class="text-xs font-black">Email</label><input type="email" id="email" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
        <div><label class="text-xs font-black">Password</label><input type="password" id="password" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
        <button type="submit" class="w-full btn-primary">Login</button>
      </form>
      <p class="text-center text-xs mt-6">Don't have an account? <a href="register.html" class="text-accent">Register</a></p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const success = await login(email, password);
      if (success) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
