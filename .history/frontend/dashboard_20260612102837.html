<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Dashboard – LocaLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Ensure form inputs have proper contrast in both themes */
    input, textarea, select {
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-main) !important;
      border-radius: 0.75rem;
      padding: 0.5rem 0.75rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-color) !important;
      ring: 2px solid var(--accent-color);
    }
    .hour-card {
      background-color: var(--card-bg);
      transition: all 0.2s;
    }
    .btn-secondary, .btn-primary {
      transition: all 0.2s;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)]">
  <div class="container mx-auto px-4 py-20">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black">Provider Dashboard</h1>
      <button id="logoutDashboardBtn" class="btn-secondary">Login</button>
    </div>
    <div id="dashboardContent">
      <div class="text-center py-20">Loading dashboard...</div>
    </div>
  </div>
</body>
</html>
