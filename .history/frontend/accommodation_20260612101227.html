 <nav class="fixed top-0 left-0 right-0 z-50 glass-nav h-20">

    <div class="flex justify-between h-full items-center">
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-9 h-9 bg-accent rounded-lg flex items-center justify-center transition-transform group-hover:rotate-12 shadow-neon">
          <span class="text-white font-display font-black text-xl"></span>
        </div>
        <span class="font-display font-black text-2xl tracking-tighter text-[var(--text-main)]">LocaLink</span>
      </a>
      <div class="hidden md:flex items-center gap-8">
        <a href="index.html" class="text-sm font-bold HOME_CLASS">Home</a>
        <a href="search.html" class="text-sm font-bold SEARCH_CLASS">Find Local Pros</a>
        <a href="pricing.html" class="text-sm font-bold PRICING_CLASS">Pricing</a>
        <a href="about.html" class="text-sm font-bold ABOUT_CLASS">About</a>
      </div>
      <div class="hidden md:flex items-center gap-6">
        <button id="themeToggle" class="p-2.5 rounded-xl border border-[var(--border-main)] text-[var(--text-main)] hover:bg-[var(--border-main)] transition-all">
          <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <div class="flex items-center gap-4 border-l border-[var(--border-main)] pl-6">
          <a href="login.html" class="text-sm font-bold text-gray-500 hover:text-[var(--text-main)] transition-colors">Login</a>
          <a href="register.html" class="text-sm font-bold text-gray-500 hover:text-[var(--text-main)] transition-colors">Register</a>

          <a href="dashboard.html" class="btn-secondary text-sm">Dashboard</a>
        </div>
      </div>
      <div class="md:hidden">
        <button id="mobileMenuBtn" class="p-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="mobileMenu" class="hidden md:hidden bg-[var(--card-bg)] border-t border-[var(--border-main)]">
    <div class="px-4 py-6 space-y-4">
      <a href="search.html" class="block text-lg font-medium">Find Services</a>
      <a href="pricing.html" class="block text-lg font-medium">Pricing</a>
      <a href="about.html" class="block text-lg font-medium">About</a>
      <a href="login.html" class="block text-lg font-medium">Login</a>
      <a href="register.html" class="block text-lg font-medium">Register</a>
      <a href="register-provider.html" class="block text-lg font-medium text-accent font-bold">Provider Sign Up</a>

    </div>
  </div>
</nav>

  <main class="pt-32 pb-20 max-w-7xl mx-auto px-4">
    <h1 class="text-5xl font-black mb-4">Accommodation in Namibia</h1>
    <p class="text-gray-400 mb-8">Find lodges, guesthouses, B&Bs, and hotels – verified and reviewed.</p>
    <div class="flex gap-4 mb-8">
      <input type="text" id="accommodationSearch" placeholder="Search by location or name..." class="flex-1 p-3 border rounded-xl bg-[var(--card-bg)]">
      <select id="accommodationType" class="p-3 border rounded-xl bg-[var(--card-bg)]">
        <option value="">All types</option>
        <option>Lodge</option><option>Guesthouse</option><option>B&B</option><option>Hotel</option><option>Camping</option>
      </select>
      <button id="searchAccommodationBtn" class="btn-primary">Search</button>
    </div>
    <div id="accommodationGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="col-span-3 text-center text-gray-500">Loading accommodation...</div>
    </div>
  </main>

  <footer>...</footer>

  <script>
    async function loadAccommodation() {
      const search = document.getElementById('accommodationSearch')?.value || '';
      const type = document.getElementById('accommodationType')?.value || '';
      let url = '/api/businesses?category=Accommodation';
      if (search) url += `&search=${encodeURIComponent(search)}`;
      if (type) url += `&category=${encodeURIComponent(type)}`;
      const res = await fetch(url);
      const businesses = await res.json();
      const grid = document.getElementById('accommodationGrid');
      if (!grid) return;
      if (businesses.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center text-gray-500">No accommodation found</div>';
        return;
      }
      grid.innerHTML = businesses.map(b => `
        <div class="bg-[var(--card-bg)] p-6 rounded-3xl border">
          <h3 class="text-xl font-black">${b.name}</h3>
          <p class="text-gray-500 text-sm mt-2">${b.address || 'Location not specified'}</p>
          <div class="mt-4 flex justify-between items-center">
            <span class="badge-verified">${b.is_verified ? 'Verified' : 'Standard'}</span>
            <a href="business.html?id=${b.id}" class="btn-primary text-sm">View Details</a>
          </div>
        </div>
      `).join('');
    }
    document.getElementById('searchAccommodationBtn')?.addEventListener('click', loadAccommodation);
    document.getElementById('accommodationSearch')?.addEventListener('keyup', loadAccommodation);
    document.getElementById('accommodationType')?.addEventListener('change', loadAccommodation);
    loadAccommodation();
  </script>
</body>
</html>
