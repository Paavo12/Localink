<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Dashboard – NamibConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)]">
  <div class="container mx-auto px-4 py-20">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black">Provider Dashboard</h1>
      <button id="logoutDashboard" class="btn-secondary">Logout</button>
    </div>
    <div id="dashboardStats" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      <div>
        <h2 class="text-2xl font-bold mb-4">Recent Bookings</h2>
        <div id="recentBookings"></div>
      </div>
      <div>
        <h2 class="text-2xl font-bold mb-4">My Services</h2>
        <div id="servicesList"></div>
        <button id="addServiceBtn" class="btn-primary mt-4">Add Service</button>
      </div>
    </div>
  </div>
</body>
</html>
