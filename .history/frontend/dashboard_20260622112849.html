<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Dashboard – Localink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=General+Sans:ital,wght@0,200..700;1,200..700&display=swap" />
  <style>
    input, textarea, select {
      background-color: var(--input-bg) !important;
      color: var(--foreground) !important;
      border: 1px solid var(--border) !important;
      border-radius: 0.75rem;
      padding: 0.5rem 0.75rem;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--orange) !important;
      box-shadow: 0 0 0 2px rgba(255,146,28,0.2);
    }
    .btn-secondary, .btn-primary { transition: all 0.2s; }
  </style>
  <script src="script.js" defer></script>
</head>
<body class="font-body antialiased bg-[var(--background)] text-[var(--foreground)]">

  <div class="container mx-auto px-4 py-20 pt-28">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-black">Provider Dashboard</h1>
      <button id="dashboardAuthBtn" class="btn-secondary">Login</button>
    </div>
    <div id="dashboardContent">
      <div class="text-center py-20">Loading dashboard...</div>
    </div>
  </div>

</body>
</html>
