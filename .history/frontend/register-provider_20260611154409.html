<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register as Provider – NamibConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)]">

  <!-- Copy exactly the same navbar as in index.html (or reuse via JS, but for simplicity include it) -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-nav h-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
      <div class="flex justify-between h-full items-center">
        <a href="index.html" class="flex items-center gap-2 group">
          <div class="w-9 h-9 bg-accent rounded-lg flex items-center justify-center transition-transform group-hover:rotate-12 shadow-neon">
            <span class="text-white font-display font-black text-xl">N</span>
          </div>
          <span class="font-display font-black text-2xl tracking-tighter text-[var(--text-main)]">NamibConnect</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="index.html" class="text-sm font-bold text-gray-400 hover:text-[var(--text-main)] transition-colors">Home</a>
          <a href="search.html" class="text-sm font-bold text-gray-400 hover:text-[var(--text-main)] transition-colors">Find Local Pros</a>
          <a href="pricing.html" class="text-sm font-bold text-gray-400 hover:text-[var(--text-main)] transition-colors">Pricing</a>
          <a href="about.html" class="text-sm font-bold text-gray-400 hover:text-[var(--text-main)] transition-colors">About</a>
        </div>
        <div class="hidden md:flex items-center gap-6">
          <button id="themeToggle" class="p-2.5 rounded-xl border border-[var(--border-main)] text-[var(--text-main)] hover:bg-[var(--border-main)] transition-all">
            <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <div class="flex items-center gap-4 border-l border-[var(--border-main)] pl-6">
            <a href="login.html" class="text-sm font-bold text-gray-500 hover:text-[var(--text-main)] transition-colors">Login</a>
            <a href="register.html" class="text-sm font-bold text-gray-500 hover:text-[var(--text-main)] transition-colors">Client Register</a>
            <a href="register-provider.html" class="btn-primary text-sm">Provider Sign Up</a>
          </div>
        </div>
        <div class="md:hidden">
          <button id="mobileMenuBtn" class="p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-[var(--card-bg)] border-t border-[var(--border-main)]">
      <div class="px-4 py-6 space-y-4">
        <a href="search.html" class="block text-lg font-medium">Find Services</a>
        <a href="pricing.html" class="block text-lg font-medium">Pricing</a>
        <a href="about.html" class="block text-lg font-medium">About</a>
        <a href="login.html" class="block text-lg font-medium">Login</a>
        <a href="register.html" class="block text-lg font-medium">Client Register</a>
        <a href="register-provider.html" class="block btn-primary text-center">Provider Sign Up</a>
      </div>
    </div>
  </nav>

  <div class="min-h-screen flex items-center justify-center px-4 pt-32 pb-20">
    <div class="bg-[var(--card-bg)] rounded-2xl border border-[var(--border-main)] p-10 w-full max-w-2xl">
      <h1 class="text-3xl font-black uppercase italic tracking-tighter text-center mb-8">Provider Registration</h1>
      <p class="text-center text-gray-500 mb-6">List your business and start getting clients</p>
      <form id="registerProviderForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div><label class="text-xs font-black">Full Name</label><input type="text" id="fullName" required class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div><label class="text-xs font-black">Email</label><input type="email" id="email" required class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div><label class="text-xs font-black">Phone (optional)</label><input type="tel" id="phone" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div><label class="text-xs font-black">Password (min 6 chars)</label><input type="password" id="password" required class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div class="md:col-span-2"><label class="text-xs font-black">Business Name</label><input type="text" id="businessName" required class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div class="md:col-span-2"><label class="text-xs font-black">Category</label><input type="text" id="category" placeholder="e.g., Hair Salon, Plumbing, Car Rental" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div class="md:col-span-2"><label class="text-xs font-black">Description</label><textarea id="description" rows="3" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></textarea></div>
          <div class="md:col-span-2"><label class="text-xs font-black">Address</label><input type="text" id="address" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
          <div class="md:col-span-2"><label class="text-xs font-black">WhatsApp Number</label><input type="tel" id="whatsapp" placeholder="e.g., +264811234567" class="w-full bg-[var(--bg-main)] border rounded-xl p-3"></div>
        </div>
        <button type="submit" class="w-full btn-primary">Register as Provider</button>
      </form>
      <p class="text-center text-xs mt-6">Already have an account? <a href="login.html" class="text-accent">Login</a></p>
    </div>
  </div>

  <footer class="bg-[var(--bg-main)] border-t border-[var(--border-main)] py-10 text-center text-gray-500 mt-12">
    <p>© 2025 NamibConnect. All rights reserved.</p>
  </footer>

  <script>
    // mobile menu toggle
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileBtn && mobileMenu) {
      mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    }

    // Handle provider registration
    document.getElementById('registerProviderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const business_name = document.getElementById('businessName').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const address = document.getElementById('address').value;
      const whatsapp_number = document.getElementById('whatsapp').value;

      const res = await fetch('/api/auth/register-provider', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, email, phone, password, business_name, category, description, address, whatsapp_number })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        alert('Registration successful! You can now access your dashboard.');
        window.location.href = 'dashboard.html';
      } else {
        alert(data.error || 'Registration failed');
      }
    });
  </script>
</body>
</html>
