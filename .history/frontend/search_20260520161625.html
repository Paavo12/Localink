<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search – NamibConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-[var(--bg-main)] text-[var(--text-main)]">
  <!-- Same navbar as index.html (copy from index.html) -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-nav h-20">...</nav>

  <div class="pt-24 pb-12 border-b border-[var(--border-main)] bg-[var(--card-bg)]">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex flex-col md:flex-row gap-6">
        <input type="text" id="searchInput" placeholder="Search service..." class="flex-1 p-4 bg-[var(--bg-main)] rounded-2xl border border-[var(--border-main)]">
        <select id="categorySelect" class="p-4 bg-[var(--bg-main)] rounded-2xl border border-[var(--border-main)]">
          <option value="">All Categories</option>
          <option>Hair Salon</option><option>Barbershop</option><option>Car Rental</option>
          <option>Plumbing</option><option>Cleaning Services</option><option>Electrician</option><option>Catering</option>
        </select>
        <button id="searchBtn" class="btn-primary px-8">Search</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-16">
    <div id="gridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
  </main>
</body>
</html>
